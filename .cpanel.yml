---
deployment:
  tasks:
    - export DEPLOYPATH=/home1/skyhine3/medizinarcare_live/
    - /bin/rsync -a
        --exclude='.git'
        --exclude='.env'
        --exclude='.claude'
        --exclude='.vscode'
        --exclude='.DS_Store'
        --exclude='docs/'
        --exclude='scripts/'
        --exclude='node_modules/'
        --exclude='package.json'
        --exclude='package-lock.json'
        --exclude='uploads/'
        --exclude='tmp/'
        --exclude='error_log'
        --exclude='medicinar/'
        . $DEPLOYPATH
    - find $DEPLOYPATH -type d -not -path '*/.git/*' -exec chmod 755 {} \;
    - find $DEPLOYPATH/app -type f -name '*.php' -exec chmod 644 {} \;
    - find $DEPLOYPATH/assets -type f -exec chmod 644 {} \;
    - mkdir -p $DEPLOYPATH/uploads/contact
    - chmod 755 $DEPLOYPATH/uploads $DEPLOYPATH/uploads/contact
    - mkdir -p $DEPLOYPATH/tmp/sessions
    - chmod 700 $DEPLOYPATH/tmp $DEPLOYPATH/tmp/sessions
    - php $DEPLOYPATH/database/setup.php
