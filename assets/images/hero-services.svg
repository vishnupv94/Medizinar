<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- ============================================
       Hero Services — Multiple Care Types
       Original illustration · Medizinar Care
       ============================================ -->

  <!-- Background -->
  <circle cx="300" cy="250" r="210" fill="#f8eed8" opacity="0.35"/>

  <!-- Central medical plus -->
  <g transform="translate(250, 180)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#176B23" opacity="0.1"/>
    <rect x="38" y="15" width="24" height="70" rx="5" fill="#176B23"/>
    <rect x="15" y="38" width="70" height="24" rx="5" fill="#176B23"/>
    <rect x="40" y="17" width="20" height="66" rx="4" fill="#a5781e" opacity="0.4"/>
    <rect x="17" y="40" width="66" height="20" rx="4" fill="#a5781e" opacity="0.4"/>
  </g>

  <!-- Service Card 1: Bedside (top-left) -->
  <g transform="translate(70, 80)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="white" stroke="#176B23" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#a5781e"/>
    <circle cx="36" cy="42" r="20" fill="#e0f4e2"/>
    <!-- Bed icon -->
    <rect x="24" y="38" width="24" height="4" rx="2" fill="#176B23"/>
    <rect x="22" y="32" width="6" height="12" rx="2" fill="#176B23"/>
    <rect x="44" y="36" width="4" height="8" rx="1" fill="#176B23"/>
    <text x="70" y="40" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Bedside</text>
    <text x="70" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Patient Care</text>
    <text x="15" y="80" font-family="sans-serif" font-size="8" fill="#666">Professional recovery</text>
    <text x="15" y="92" font-family="sans-serif" font-size="8" fill="#666">support at home</text>
  </g>

  <!-- Service Card 2: Elderly (top-right) -->
  <g transform="translate(390, 80)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="white" stroke="#176B23" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#a5781e"/>
    <circle cx="36" cy="42" r="20" fill="#f8eed8"/>
    <!-- Walking stick icon -->
    <rect x="33" y="28" width="3" height="26" rx="1" fill="#a5781e"/>
    <path d="M28 28 Q34 24 40 28" fill="none" stroke="#a5781e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="40" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Elderly</text>
    <text x="70" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Care</text>
    <text x="15" y="80" font-family="sans-serif" font-size="8" fill="#666">Compassionate daily</text>
    <text x="15" y="92" font-family="sans-serif" font-size="8" fill="#666">assistance &amp; companionship</text>
  </g>

  <!-- Service Card 3: Mother & Baby (bottom-left) -->
  <g transform="translate(70, 310)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="white" stroke="#176B23" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#a5781e"/>
    <circle cx="36" cy="42" r="20" fill="#e0f4e2"/>
    <!-- Heart icon -->
    <path d="M36 35 C36 30, 44 30, 44 35 C44 42, 36 48, 36 48 C36 48, 28 42, 28 35 C28 30, 36 30, 36 35Z" fill="#a5781e"/>
    <text x="70" y="40" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Mother &amp;</text>
    <text x="70" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Baby Care</text>
    <text x="15" y="80" font-family="sans-serif" font-size="8" fill="#666">Postnatal care for</text>
    <text x="15" y="92" font-family="sans-serif" font-size="8" fill="#666">mother and newborn</text>
  </g>

  <!-- Service Card 4: House Maid (bottom-right) -->
  <g transform="translate(390, 310)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="white" stroke="#176B23" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#a5781e"/>
    <circle cx="36" cy="42" r="20" fill="#f8eed8"/>
    <!-- House icon -->
    <path d="M24 42 L36 30 L48 42 L48 54 L24 54 Z" fill="none" stroke="#176B23" stroke-width="2"/>
    <rect x="33" y="46" width="6" height="8" rx="1" fill="#176B23"/>
    <text x="70" y="40" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">House Maid</text>
    <text x="70" y="52" font-family="sans-serif" font-size="10" font-weight="700" fill="#333">Services</text>
    <text x="15" y="80" font-family="sans-serif" font-size="8" fill="#666">Reliable household</text>
    <text x="15" y="92" font-family="sans-serif" font-size="8" fill="#666">domestic support</text>
  </g>

  <!-- Connecting lines from center to cards -->
  <line x1="260" y1="220" x2="200" y2="160" stroke="#a5781e" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="340" y1="220" x2="400" y2="160" stroke="#a5781e" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="260" y1="280" x2="200" y2="340" stroke="#a5781e" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="340" y1="280" x2="400" y2="340" stroke="#a5781e" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="300" cy="50" r="4" fill="#a5781e" opacity="0.4"/>
  <circle cx="300" cy="450" r="4" fill="#176B23" opacity="0.4"/>
  <circle cx="50" cy="250" r="3" fill="#a5781e" opacity="0.3"/>
  <circle cx="550" cy="250" r="3" fill="#176B23" opacity="0.3"/>

  <!-- Trust badges bottom -->
  <g transform="translate(190, 450)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="white" stroke="#a5781e" stroke-width="1.2"/>
    <circle cx="24" cy="16" r="8" fill="#176B23"/>
    <text x="24" y="20" font-family="sans-serif" font-size="9" text-anchor="middle" fill="white">✓</text>
    <text x="42" y="20" font-family="sans-serif" font-size="9" font-weight="600" fill="#333">Trusted by 100+ Families</text>
    <circle cx="186" cy="16" r="8" fill="#a5781e"/>
    <text x="186" y="20" font-family="sans-serif" font-size="9" text-anchor="middle" fill="white">★</text>
  </g>
</svg>
