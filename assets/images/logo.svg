<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Medizinar Care logo">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e8a2d"/>
      <stop offset="100%" style="stop-color:#176B23"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="28" cy="28" r="25" fill="url(#iconGrad)"/>

  <!-- White cross (medical) -->
  <rect x="22" y="15" width="12" height="26" rx="3" fill="white"/>
  <rect x="15" y="22" width="26" height="12" rx="3" fill="white"/>

  <!-- Gold accent center dot -->
  <circle cx="28" cy="28" r="4.5" fill="#a5781e"/>

  <!-- "Medizinar" text -->
  <text x="62" y="26"
        font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
        font-size="18"
        font-weight="700"
        fill="#176B23"
        letter-spacing="-0.3">Medizinar</text>

  <!-- "CARE" text -->
  <text x="63" y="43"
        font-family="'DM Sans', 'Segoe UI', Arial, sans-serif"
        font-size="11"
        font-weight="600"
        fill="#a5781e"
        letter-spacing="3.5">CARE</text>
</svg>
