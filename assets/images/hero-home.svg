<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- ============================================
       Hero Home — Caregiver & Patient at Home
       Original illustration · Medizinar Care
       ============================================ -->

  <!-- Background soft circle -->
  <circle cx="300" cy="260" r="220" fill="#e0f4e2" opacity="0.5"/>
  <circle cx="300" cy="260" r="160" fill="#f8eed8" opacity="0.4"/>

  <!-- House shape -->
  <path d="M160 280 L300 170 L440 280 L440 420 L160 420 Z" fill="white" stroke="#176B23" stroke-width="2.5"/>
  <!-- Roof -->
  <path d="M140 285 L300 158 L460 285" fill="none" stroke="#a5781e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Roof accent -->
  <circle cx="300" cy="158" r="6" fill="#a5781e"/>

  <!-- Door -->
  <rect x="268" y="340" width="64" height="80" rx="6" fill="#176B23"/>
  <circle cx="322" cy="382" r="4" fill="#a5781e"/>

  <!-- Window Left -->
  <rect x="186" y="300" width="56" height="50" rx="4" fill="#e0f4e2" stroke="#176B23" stroke-width="1.5"/>
  <line x1="214" y1="300" x2="214" y2="350" stroke="#176B23" stroke-width="1"/>
  <line x1="186" y1="325" x2="242" y2="325" stroke="#176B23" stroke-width="1"/>

  <!-- Window Right -->
  <rect x="358" y="300" width="56" height="50" rx="4" fill="#e0f4e2" stroke="#176B23" stroke-width="1.5"/>
  <line x1="386" y1="300" x2="386" y2="350" stroke="#176B23" stroke-width="1"/>
  <line x1="358" y1="325" x2="414" y2="325" stroke="#176B23" stroke-width="1"/>

  <!-- Medical cross on house -->
  <rect x="288" y="220" width="24" height="50" rx="4" fill="#a5781e"/>
  <rect x="278" y="233" width="44" height="24" rx="4" fill="#a5781e"/>

  <!-- Caregiver figure (left) -->
  <g transform="translate(90, 240)">
    <!-- Body -->
    <circle cx="45" cy="30" r="22" fill="#f8eed8"/>
    <circle cx="45" cy="30" r="18" fill="#a5781e" opacity="0.2"/>
    <!-- Head -->
    <circle cx="45" cy="30" r="15" fill="#d4a574"/>
    <!-- Hair -->
    <path d="M30 25 Q35 10 45 12 Q55 10 60 25" fill="#5a3e2b"/>
    <!-- Eyes -->
    <circle cx="40" cy="28" r="1.5" fill="#333"/>
    <circle cx="50" cy="28" r="1.5" fill="#333"/>
    <!-- Smile -->
    <path d="M40 34 Q45 38 50 34" fill="none" stroke="#333" stroke-width="1"/>
    <!-- Scrubs -->
    <rect x="30" y="48" width="30" height="42" rx="5" fill="#176B23"/>
    <!-- Apron/vest -->
    <rect x="35" y="50" width="20" height="30" rx="3" fill="#e0f4e2"/>
    <!-- Cross on apron -->
    <rect x="42" y="56" width="6" height="16" rx="1" fill="#a5781e"/>
    <rect x="37" y="61" width="16" height="6" rx="1" fill="#a5781e"/>
    <!-- Arms -->
    <rect x="20" y="52" width="10" height="28" rx="5" fill="#d4a574"/>
    <rect x="60" y="52" width="10" height="28" rx="5" fill="#d4a574"/>
    <!-- Legs -->
    <rect x="34" y="88" width="10" height="30" rx="4" fill="#176B23"/>
    <rect x="50" y="88" width="10" height="30" rx="4" fill="#176B23"/>
    <!-- Shoes -->
    <rect x="32" y="115" width="14" height="8" rx="4" fill="#333"/>
    <rect x="48" y="115" width="14" height="8" rx="4" fill="#333"/>
    <!-- Stethoscope -->
    <path d="M38 48 Q35 60 40 70" fill="none" stroke="#a5781e" stroke-width="2"/>
    <circle cx="40" cy="72" r="4" fill="#a5781e"/>
  </g>

  <!-- Patient figure (right, seated) -->
  <g transform="translate(420, 280)">
    <!-- Chair -->
    <rect x="10" y="40" width="60" height="50" rx="6" fill="#f8eed8" stroke="#a5781e" stroke-width="1.5"/>
    <rect x="55" y="20" width="12" height="70" rx="4" fill="#f8eed8" stroke="#a5781e" stroke-width="1.5"/>
    <!-- Legs of chair -->
    <rect x="14" y="88" width="6" height="25" rx="2" fill="#a5781e"/>
    <rect x="58" y="88" width="6" height="25" rx="2" fill="#a5781e"/>
    <!-- Head -->
    <circle cx="40" cy="10" r="14" fill="#e8c9a0"/>
    <!-- Hair -->
    <path d="M26 6 Q32 -6 40 -4 Q48 -6 54 6" fill="#999"/>
    <!-- Eyes -->
    <circle cx="35" cy="8" r="1.5" fill="#333"/>
    <circle cx="45" cy="8" r="1.5" fill="#333"/>
    <!-- Smile -->
    <path d="M35 15 Q40 18 45 15" fill="none" stroke="#333" stroke-width="1"/>
    <!-- Body/Shawl -->
    <rect x="25" y="24" width="35" height="32" rx="5" fill="#e0f4e2" stroke="#176B23" stroke-width="1"/>
    <!-- Blanket -->
    <rect x="12" y="58" width="55" height="18" rx="4" fill="#176B23" opacity="0.3"/>
    <!-- Arm -->
    <rect x="16" y="30" width="8" height="22" rx="4" fill="#e8c9a0"/>
  </g>

  <!-- Heart between them -->
  <g transform="translate(262, 330)">
    <path d="M12 4 C12 -2, 22 -2, 22 4 C22 10, 12 18, 12 18 C12 18, 2 10, 2 4 C2 -2, 12 -2, 12 4Z" fill="#a5781e" opacity="0.8"/>
  </g>

  <!-- Floating badge elements -->
  <!-- Shield badge top-right -->
  <g transform="translate(470, 120)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="white" stroke="#176B23" stroke-width="1.5"/>
    <path d="M18 10 L18 8 Q18 4, 22 4 L26 4 Q30 4, 30 8 L30 10 L32 10 L32 22 Q32 25, 25 26 L25 26 Q18 25, 18 22 L18 10 Z" fill="#176B23" transform="scale(0.7) translate(15, 3)"/>
    <text x="42" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#176B23">Verified</text>
  </g>

  <!-- 24/7 badge top-left -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="70" height="36" rx="18" fill="white" stroke="#a5781e" stroke-width="1.5"/>
    <text x="35" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#a5781e" text-anchor="middle">24 / 7</text>
  </g>

  <!-- Star badge bottom-left -->
  <g transform="translate(80, 400)">
    <circle cx="18" cy="18" r="18" fill="#a5781e"/>
    <text x="18" y="23" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">★</text>
  </g>

  <!-- Small decorative dots -->
  <circle cx="500" cy="350" r="4" fill="#a5781e" opacity="0.4"/>
  <circle cx="515" cy="340" r="3" fill="#176B23" opacity="0.3"/>
  <circle cx="508" cy="365" r="2.5" fill="#a5781e" opacity="0.3"/>
  <circle cx="110" cy="350" r="4" fill="#176B23" opacity="0.3"/>
  <circle cx="95" cy="340" r="3" fill="#a5781e" opacity="0.4"/>
  <circle cx="102" cy="365" r="2.5" fill="#176B23" opacity="0.3"/>

  <!-- Ground line / grass -->
  <path d="M80 425 Q200 415 300 425 Q400 435 520 420" fill="none" stroke="#176B23" stroke-width="2" opacity="0.3"/>
  <path d="M100 430 Q200 422 300 430 Q400 438 500 425" fill="none" stroke="#a5781e" stroke-width="1.5" opacity="0.2"/>
</svg>
